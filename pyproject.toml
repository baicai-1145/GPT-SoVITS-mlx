[project]
name = "gsovits-mlx"
version = "0.1.0"
description = "GPT-SoVITS text-to-speech on Apple MLX — all 8 official model families (v1/v2/v2Pro/v2ProPlus/v3/v4/v5dev/v5turbo), zero torch at inference; official multi-language front-end (zh/ja/ko/yue/en, auto) on Metal"
keywords = ["tts", "gpt-sovits", "mlx", "apple-silicon", "metal", "speech-synthesis", "text-to-speech"]
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: MLX kernel releases change fp ulp behavior, which flips
    # near-tie AR sampler decisions and shifts seeded e2e anchors (0.32.2 vs
    # 0.32.3 -> 119 vs 112 tokens on the bench cell). Upgrade = re-render all
    # anchors in /Volumes/2T/gpt-sovits-models/bench/mlx_seed0/ (see BENCH.md).
    "mlx==0.32.2",
    # Same ulp-flip sensitivity measured for numpy patch releases (2.5.2 ->
    # 2.5.3 flips the same cell 119 -> 112 with mlx identical). Keep exact.
    "numpy==2.5.2",
    "tokenizers>=0.19",
    "soundfile>=0.12",
    "safetensors>=0.8.0",
    "av>=19.0.1",
]

[project.optional-dependencies]
# Weight conversion runs the official torch checkpoints; inference never needs torch.
# A one-off tokenizer cross-check vs transformers AutoTokenizer: `uv run --with transformers \
#   pytest -q tests/test_tokenizer.py` (see that file's docstring).
convert = ["torch>=2.2"]
# Official text front-end (multi-language G2P via the vendored CPUFast modules).
# Core inference stays lean; only synthesis with the full language matrix needs these.
frontend = [
    "jieba-fast",
    "pypinyin",
    "jamo",
    "ko-pron",
    "ToJyutping",
    "split-lang",
    "g2p-en",
    "g2pk2",
    "cn2an",
    "pyopenjtalk",
    "nltk",
    "python-mecab-ko",
    "fast-langdetect",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "heavy: requires converted models on /Volumes/2T (deselect with -m 'not heavy')",
]

[tool.uv]
package = false
