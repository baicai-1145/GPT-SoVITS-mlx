[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gsovits-mlx"
version = "0.1.0"
description = "GPT-SoVITS text-to-speech on Apple MLX — all 8 official model families (v1/v2/v2Pro/v2ProPlus/v3/v4/v5dev/v5turbo), zero torch at inference; official multi-language front-end on Metal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "baicai-1145" },
]
keywords = [
    "tts",
    "gpt-sovits",
    "mlx",
    "apple-silicon",
    "metal",
    "speech-synthesis",
    "text-to-speech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Pinned exactly: MLX kernel releases change fp ulp behavior, which flips
    # near-tie AR sampler decisions and shifts seeded e2e anchors (0.32.2 vs
    # 0.32.3 -> 119 vs 112 tokens on the bench cell). Upgrade = re-render all
    # anchors in /Volumes/2T/gpt-sovits-models/bench/mlx_seed0/ (see BENCH.md).
    "mlx==0.32.2",
    # Same ulp-flip sensitivity measured for numpy patch releases (2.5.2 ->
    # 2.5.3 flips the same cell 119 -> 112 with mlx identical). Keep exact.
    "numpy==2.5.2",
    # PyAV: official audio decode. WITHOUT it e2e silently falls back to
    # soundfile+linear-resample, which shifts prompt codes -> different
    # seeded AR stream (110 vs 113 tokens measured). Version-sensitive
    # for the same reason: keep 18.1.0 exact (19.x bundles a different
    # ffmpeg decode path).
    "av==18.1.0",
    # Weight containers: io.py imports safetensors directly; it was
    # undeclared until this bit a fresh-venv factorial run.
    "safetensors>=0.8",
    "tokenizers>=0.19",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Weight conversion runs the official torch checkpoints; inference never needs torch.
convert = ["torch>=2.2"]
# Official text front-end (multi-language G2P via the vendored CPUFast modules).
# Core inference stays lean; only synthesis with the full language matrix needs these.
frontend = [
    "jieba-fast",
    "pypinyin",
    "jamo",
    "ko-pron",
    "ToJyutping",
    "split-lang",
    "g2p-en",
    "g2pk2",
    "cn2an",
    "pyopenjtalk",
    "nltk",
    "python-mecab-ko",
    "fast-langdetect",
]
asr = [
    "funasr-mlx>=0.2.0",
]
mss = [
    "pymss>=2.1.8",
]
dev = [
    "pytest>=8.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/baicai-1145/GPT-SoVITS-mlx"
Repository = "https://github.com/baicai-1145/GPT-SoVITS-mlx"
Issues = "https://github.com/baicai-1145/GPT-SoVITS-mlx/issues"

[project.scripts]
gsovits = "gsovits_mlx.cli.main:main"
gsovits-e2e = "gsovits_mlx.cli.e2e:main"
gsovits-download = "gsovits_mlx.download:main"
gsovits-prepare = "gsovits_mlx.cli.prepare_data:main"
gsovits-train-s1 = "gsovits_mlx.cli.train_s1:main"
gsovits-train-s2 = "gsovits_mlx.cli.train_s2:main"
gsovits-train-s2-v3 = "gsovits_mlx.cli.train_s2_v3:main"
gsovits-extract = "gsovits_mlx.cli.train_s2_extract:main"
gsovits-convert = "gsovits_mlx.cli.convert_sovits:main"

[tool.hatch.build.targets.wheel]
packages = ["gsovits_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "heavy: requires converted models on /Volumes/2T (deselect with -m 'not heavy')",
]
