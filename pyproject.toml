[project]
name = "gsovits-mlx"
version = "0.1.0"
description = "GPT-SoVITS text-to-speech on Apple MLX (v1/v2/v2Pro/v2ProPlus/v3/v4/v5dev/v5turbo)"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.21",
    "numpy>=1.26",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# Weight conversion runs the official torch checkpoints; inference never needs torch.
convert = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "heavy: requires converted models on /Volumes/2T (deselect with -m 'not heavy')",
]

[tool.uv]
package = false
